name: Update Kaggle Badges

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install browser for badge generation
        run: npx puppeteer browsers install chrome@131.0.6778.85

      - name: Generate Kaggle badges
        uses: takayoshi-makabe/kaggle-badges@v1.4.0
        with:
          user_name: pamiduvidusaka

      - name: Commit generated badges
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ./kaggle-badges ./kaggle-plates
          if git diff --cached --quiet; then
            echo "No badge changes to commit."
          else
            git commit -m "Update Kaggle badges"
            git push
          fi
