name: Update Kaggle Badges

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-badges:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Update Kaggle Badges
        uses: spidermandance/kaggle-badges@v1
        with:
          kaggle_username: 'pamiduvidusaka'
