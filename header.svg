<svg width="100%" height="160" viewBox="0 0 850 160" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117" />
      <stop offset="50%" stop-color="#161b22" />
      <stop offset="100%" stop-color="#1b2430" />
    </linearGradient>
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20BEFF" />
      <stop offset="50%" stop-color="#58a6ff" />
      <stop offset="100%" stop-color="#3fb950" />
    </linearGradient>
    <linearGradient id="wave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#20BEFF" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="wave2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3fb950" stop-opacity="0.25" />
    </linearGradient>
  </defs>

  <!-- Background Card -->
  <rect width="850" height="160" rx="12" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.2" />

  <!-- Decorative Waves -->
  <path d="M0 120 Q 212 95 425 125 T 850 120 L 850 160 L 0 160 Z" fill="url(#wave1)" />
  <path d="M0 135 Q 212 110 425 138 T 850 132 L 850 160 L 0 160 Z" fill="url(#wave2)" />

  <!-- Accent Top Border -->
  <rect x="0" y="0" width="850" height="3" rx="1.5" fill="url(#accentGradient)" />

  <!-- Typography -->
  <g text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <text x="425" y="65" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="0.5">
      Pamidu Vidusaka
    </text>
    <text x="425" y="96" font-size="13.5" font-weight="600" fill="url(#accentGradient)" letter-spacing="1.2">
      CIVIL ENGINEERING UNDERGRADUATE • SYSTEMS &amp; TECH ENTHUSIAST
    </text>
    <text x="425" y="120" font-size="12" font-weight="400" fill="#8b949e">
      Faculty of Engineering • University of Sri Jayewardenepura • Sri Lanka
    </text>
  </g>
</svg>
